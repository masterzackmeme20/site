<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fazer Pedido</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #111;
    }
    button {
      padding: 18px 36px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: #052e16;
    }
    button:hover {
      background: #16a34a;
    }
  </style>
</head>
<body>
  <button id="btnPedido">Fazer pedido</button>

  <script>
    const CANAL = "seu-canal-unico-aqui"; // use o mesmo nome no script do PC

    document.getElementById("btnPedido").addEventListener("click", async () => {
      await fetch(`https://ntfy.sh/${CANAL}`, {
        method: "POST",
        body: "pedido feito"
      });
    });
  </script>
</body>
</html>

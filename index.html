<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }
    .topo {
      width: 100%;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      background: #7f1d1d;
      color: #fecaca;
      transition: background 0.2s, color 0.2s;
    }
    .topo.aberta {
      background: #14532d;
      color: #bbf7d0;
    }
    .centro {
      flex: 1;
      display: grid;
      place-items: center;
      width: 100%;
    }
    button {
      padding: 18px 36px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: #052e16;
    }
    button:hover {
      background: #16a34a;
    }
  </style>
</head>
<body>
  <div id="statusLoja" class="topo">Loja fechada</div>

  <div class="centro">
    <button id="btnPedido">Fazer pedido</button>
  </div>

  <script>
    const CANAL_PEDIDOS = "seu-canal-pedidos-aqui";
    const CANAL_STATUS  = "seu-canal-status-aqui";

    const elStatus = document.getElementById("statusLoja");
    let ultimoSinal = 0;

    function atualizarVisualLoja() {
      const aberta = (Date.now() - ultimoSinal) <= 12000;
      if (aberta) {
        elStatus.textContent = "Loja aberta";
        elStatus.classList.add("aberta");
      } else {
        elStatus.textContent = "Loja fechada";
        elStatus.classList.remove("aberta");
      }
    }

    // Checa a cada 1 segundo se ainda esta chegando sinal do C++
    setInterval(atualizarVisualLoja, 1000);

    // Escuta o canal de status em tempo real via SSE do ntfy.sh
    const fonteStatus = new EventSource(`https://ntfy.sh/${CANAL_STATUS}/sse`);
    fonteStatus.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.event === "message" && data.message === "online") {
          ultimoSinal = Date.now();
          atualizarVisualLoja();
        }
      } catch (_) {}
    };

    // Botao de fazer pedido
    document.getElementById("btnPedido").addEventListener("click", async () => {
      await fetch(`https://ntfy.sh/${CANAL_PEDIDOS}`, {
        method: "POST",
        body: "pedido feito"
      });
    });
  </script>
</body>
</html>
